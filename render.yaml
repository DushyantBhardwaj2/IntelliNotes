services:
  - type: web
    name: intellinotes-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    disk:
      name: intellinotes-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "10"
      - key: KEEP_ALIVE_URL
        value: "https://intellinotes-backend.onrender.com/ping"
